[project]
name = "agentvitals"
version = "0.1.0"
description = "Read any CLI agent's session file and report what the run actually did — step by step, with error bars."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Yukun He" }]
keywords = ["agent", "evaluation", "trajectory", "observability", "llm", "sre", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/YukunHe304/agentvitals"
Repository = "https://github.com/YukunHe304/agentvitals"

[project.scripts]
agentvitals = "agentvitals.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agentvitals = ["questions/*.json", "data/*.json", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
